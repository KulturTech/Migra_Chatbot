[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migra-chatbot"
version = "0.1.0"
description = "KI-gestützter Interview-Assistent für Migrationsforschung"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"interviewbot" = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
